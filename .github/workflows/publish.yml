name: publish

# npm trusted publishing (oidc): no tokens, provenance attached. both
# packages publish from the borgo release tag, borgo first so create-borgo
# can always resolve its linked version.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: git tag to publish from (e.g. v0.2.0)
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    # the linked create-borgo release fires its own event; publish once, from
    # the plain vX.Y.Z tag
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.release.tag_name, 'create-borgo')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      # both packages carry the same linked version; a tag/package mismatch
      # would publish the wrong bits, so it fails loudly before npm is touched
      - name: package versions match the tag
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}"
          version="${tag#v}"
          for pkg in packages/borgo packages/create-borgo; do
            actual="$(node -p "require('./$pkg/package.json').version")"
            if [ "$actual" != "$version" ]; then
              echo "::error::$pkg is at $actual but the tag is $tag"
              exit 1
            fi
          done

      - name: publish borgo
        run: npm publish --provenance --access public
        working-directory: packages/borgo

      - name: publish create-borgo
        run: npm publish --provenance --access public
        working-directory: packages/create-borgo
