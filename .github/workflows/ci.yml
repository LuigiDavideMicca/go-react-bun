name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: install workspace
        run: bun install --frozen-lockfile

      - name: docs links resolve
        run: bun scripts/check-doc-links.ts

      - name: build go core
        run: |
          go build ./...
          go vet ./...

      - name: go tests
        run: go test ./...

      - name: build example go module
        working-directory: examples/tasks
        run: |
          go build ./...
          go vet ./...

      - name: generated api types are fresh
        working-directory: examples/tasks
        run: |
          go tool borgogen
          git diff --exit-code -- .borgo/api-types.d.ts api/borgo.gen.go

      - name: typecheck
        run: bun run typecheck

      - name: bun tests
        run: bun test packages/borgo/test

      - name: typed request bodies reject a wrong body
        working-directory: examples/tasks
        run: |
          printf '%s\n' \
            'import type { ActionContext } from "borgo-framework";' \
            'export async function action({ api }: ActionContext) {' \
            '  await api("POST /api/tasks", { body: { titel: "typo" } });' \
            '  return {};' \
            '}' \
            'export default function Wrong() { return null; }' \
            > pages/__wrong-body.tsx
          if bunx tsc --noEmit; then echo "wrong body was accepted" && exit 1; fi
          rm pages/__wrong-body.tsx

      - name: typed ws events reject a wrong payload
        working-directory: examples/tasks
        run: |
          printf '%s\n' \
            'import { subscribe } from "borgo-framework";' \
            'export function wrong() {' \
            '  subscribe("live", (event, data) => {' \
            '    if (event === "task-created") data.toFixed(2);' \
            '  });' \
            '}' \
            'export default function Wrong() { return null; }' \
            > pages/__wrong-ws.tsx
          if bunx tsc --noEmit; then echo "wrong ws payload was accepted" && exit 1; fi
          rm pages/__wrong-ws.tsx

      - name: typed ws publish rejects a wrong payload
        working-directory: examples/tasks
        run: |
          printf '%s\n' \
            'import { subscribe } from "borgo-framework";' \
            'export function wrong() {' \
            '  const channel = subscribe("live", () => {});' \
            '  channel.publish("message", 42);' \
            '}' \
            'export default function Wrong() { return null; }' \
            > pages/__wrong-publish.tsx
          if bunx tsc --noEmit; then echo "wrong publish payload was accepted" && exit 1; fi
          rm pages/__wrong-publish.tsx

      - name: build example app
        working-directory: examples/tasks
        run: bun run build

      - name: server-only code stays out of client assets
        working-directory: examples/tasks
        run: |
          grep -q "borgo-server-only-sentinel" pages/index.tsx
          ! grep -rq "borgo-server-only-sentinel" public/assets

      - name: smoke test example app
        working-directory: examples/tasks
        run: |
          bun run start &
          for i in $(seq 1 20); do curl -fs http://localhost:3000/ > /dev/null && break; sleep 1; done
          curl -fs http://localhost:3000/ | grep -q "<h1>Tasks</h1>"
          curl -fs -X POST http://localhost:3000/api/tasks -H "Content-Type: application/json" -d '{"title":"ci smoke"}' | grep -q "ci smoke"
          curl -fs http://localhost:3000/ | grep -q "ci smoke"
          curl -fs http://localhost:3000/tasks/1 | grep -q "ci smoke"

      - name: install playwright chromium
        run: npx playwright install --with-deps chromium

      - name: e2e tests
        run: npx playwright test

      - name: scaffold test
        run: |
          tmp="$(mktemp -d)"
          cd packages/borgo && bun pm pack --destination "$tmp" && cd "$tmp"
          bun "$GITHUB_WORKSPACE/packages/create-borgo/src/cli.ts" smoke-app
          cd smoke-app
          echo "replace github.com/LuigiDavideMicca/borgo => $GITHUB_WORKSPACE" >> go.mod
          tgz="$(ls ../borgo-*.tgz | head -1)"
          sed -i "s#\"borgo-framework\": \"[^\"]*\"#\"borgo-framework\": \"file:$tgz\"#" package.json
          bun install
          go mod tidy
          cp .borgo/api-types.d.ts "$tmp/shipped-api-types.d.ts"
          go tool borgogen
          diff "$tmp/shipped-api-types.d.ts" .borgo/api-types.d.ts
          bun run build
          PORT=3100 API_PORT=3601 bun run start &
          for i in $(seq 1 20); do curl -fs http://localhost:3100/ > /dev/null && break; sleep 1; done
          curl -fs http://localhost:3100/ | grep -q "Get started by editing"
          curl -fs http://localhost:3100/hello/ci | grep -q "hello, ci"
          curl -fs http://localhost:3100/api/hello | grep -q "hello from go"
